name: Build

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "owner/repo"
        required: false
        default: ""
      source_ref:
        description: "ref"
        required: false
        default: ""
      toolchain_version:
        description: "toolchain version"
        required: false
        default: "1.11.0"
      obfuscation:
        description: "on / off"
        required: false
        default: "on"
      obf_level:
        description: "1 / 2 / 3"
        required: false
        default: "3"
      release_tag:
        description: "tag"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
  OLLVM_DIR: ${{ github.workspace }}/.toolchain
  TOOLCHAIN_TAG: toolchain
  OBF_LEVEL: ${{ inputs.obf_level }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      INPUT_SOURCE_REPO: ${{ inputs.source_repo }}
      INPUT_SOURCE_REF: ${{ inputs.source_ref }}
      INPUT_TOOLCHAIN_VERSION: ${{ inputs.toolchain_version }}
      INPUT_OBFUSCATION: ${{ inputs.obfuscation }}
      INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        env:
          SECRET_PAT: ${{ secrets.SRC_TOKEN || secrets.Actions }}
          VARS_REPO: ${{ vars.SRC_REPO }}
        run: bash scripts/1-setup.sh

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SRC_REPO || inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SRC_TOKEN || secrets.Actions }}
          path: src
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Mask source literals
        run: bash scripts/2-mask.sh src

      - name: Dependencies
        run: bash scripts/2-deps.sh src

      - name: Toolchain
        env:
          GH_TOKEN: ${{ secrets.SRC_TOKEN || secrets.Actions }}
        run: bash scripts/3-toolchain.sh

      - name: Build
        run: bash scripts/4-build.sh src

      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.SRC_TOKEN || secrets.Actions }}
        run: bash scripts/5-upload.sh
